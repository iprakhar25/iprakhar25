spring.application.name=iprakhar25-portfolio
server.port=8080

# H2 Database Configuration (Local Development)
spring.datasource.url=jdbc:h2:mem:portfoliodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# H2 Console (Development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=${JWT_SECRET:portfolio-super-secret-key-change-in-production-please-thank-you-very-much}
jwt.expiration=86400000

# Music/YouTube Configuration
music.python.script.path=scripts/fetch_youtube_music.py
# Portfolio Configuration
portfolio.birth-date=2002-03-25

# Logging
logging.level.root=INFO
logging.level.com.portfolio.app=DEBUG
