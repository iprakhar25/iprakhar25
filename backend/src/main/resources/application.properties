spring.application.name=portfolio-app
server.port=8080

# H2 Database Configuration (Development)
spring.datasource.url=jdbc:h2:mem:portfoliodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# PostgreSQL Configuration (Production - uncomment and configure)
# spring.datasource.url=jdbc:postgresql://localhost:5432/portfolio_db
# spring.datasource.username=postgres
# spring.datasource.password=your_password
# spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL10Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Development only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Configuration
jwt.secret=portfolio-super-secret-key-change-in-production-please-thank-you-very-much
jwt.expiration=86400000

# Portfolio Configuration
portfolio.birth-date=1995-07-15

# Logging
logging.level.root=INFO
logging.level.com.portfolio.app=DEBUG
